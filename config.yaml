---
# AI Agent 黑灯工厂插件：Specs 进，可工作的软件出。
# 融合 Reversa 逆向工程（规格逆向）后形成「逆向分析 → 正向开发 → 知识回流」闭环。
id: ai-dark-factory
name: AI Agent 黑灯工厂
description: >-
  AI Agent 黑灯工厂——Specs 进，可工作的软件出。多 Agent 自主写码/测试/评估，
  人类审 pass/fail 报告。融合 Reversa 逆向工程：对遗留项目做规格逆向分析，
  生成结构化规格（_reversa_sdd/）并导出为 rule 知识库，形成逆向→正向→知识回流闭环。
version: 0.3.0
license: MIT
logo: assets/ai-dark-factory-icon.svg
rules_load_dirs:
  - "{{plugin_dir}}/rules"
tool_load_dirs:
  - "{{plugin_dir}}/tools"
orchestration:
  - name: dark-factory-pipeline
    description: AI 黑灯工厂编排流水线——Specs 进，可工作的软件出
    file: "{{plugin_dir}}/orchestration/dark_factory_pipeline.yaml"
# --- 前端扩展：黑灯工厂侧边栏视图（普通用户可用，不做管理面板）---
frontend:
  sidebar_views:
    - id: ai-dark-factory
      title: "黑灯工厂"
      entry: sidebar_view.js
      icon: frontend/icon.svg
# --- 依赖声明 ---
dependencies:
  commands:
    - node
    - npm
# --- 自定义能力清单（前端展示用）---
capabilities:
  - name: "规格逆向工程"
    description: >-
      对遗留项目执行 Reversa 5 阶段逆向工程，生成结构化 Markdown 规格
  - name: "Rule 知识库导出"
    description: >-
      将 _reversa_sdd/ 产物按置信度导出为 Jarvis rule，供后续任务复用
  - name: "生命周期管理"
    description: >-
      安装/状态/更新/卸载 Reversa 工作区（绕过交互式 CLI 直连 installer 库）
replace_map:
  dark-factory/clarify:
    append: false
    template: |
      请先澄清以下需求，直到 NLSpec 清晰、可开工，再进入黑灯工厂流水线。
      ## 你必须遵守的规则
      - **必须**：遵守 pipeline_invariants 流程不变量规则（NLSpec 四要素先行、固定 spec 目录等）。
      - **必须**：先用 LLM 能力通读需求，识别 NLSpec 四要素（Goal/Constraints/
        Interfaces/Non-goals）中缺失、模糊或自相矛盾的部分，形成问题清单。
      - **必须**：逐条向用户提问（一次问清一批，不要挤牙膏），把用户回答整理进
        NLSpec，更新后再复验，直到四要素完整、无模糊项。
      - **必须**：把最终 NLSpec 落盘到固定 spec 目录 .jarvis/.df/specs/<功能名>.md
        （每功能一个 spec 文件），澄清问答可一并留痕。
      - **禁止**：四要素未齐、仍有模糊项时就开始实现；用启发式工具代替追问。
      ## 你必须执行的操作
      1. 通读需求，对照四要素诊断缺口（缺哪个要素、哪里模糊、哪里矛盾）。
      2. 向用户逐条提问补齐缺口；用户回答后更新 NLSpec。
      3. 复验四要素完整、约束显式、接口精确、Non-goals 明确后，把最终 NLSpec
        与澄清问答写入 .jarvis/.df/specs/<功能名>.md。
      4. 确认无歧义后，引导进入 <dark-factory/run> 开始开发。
    description: 澄清需求直到 NLSpec 清晰可开工
  dark-factory/run:
    append: false
    template: |
      请使用 AI 黑灯工厂流水线自动完成以下开发（用内置编排引擎 pipeline_runner 驱动）。
      ## 你必须遵守的规则
      - **必须**：遵守 pipeline_invariants 流程不变量规则（NLSpec 四要素先行、遵守规则集、
        在已有代码库工作、TDD 铁律、固定 spec 目录、知识回流、门禁人工审批、holdout 隔离纪律）。
      - **必须**：编排文件是每次任务动态生成的「结构化 plan」：根据 spec 与
        代码库现状，和用户共同讨论出编排文件（agents + flow），用户确认后再执行。
      - **必须**：门禁阶段停住，把审批报告交人工审批，不自动合并。
      - **禁止**：未经用户确认就执行编排；未经人工审批自动放行门禁。
      ## 你必须执行的操作
      1. 确认/补全 NLSpec：先 read_code 读取固定 NLSpec 文件
        .jarvis/.df/specs/<功能名>.md（若存在）；四要素不齐或模糊时，先向用户
        逐条提问澄清，更新后再复验。
      2. 与用户讨论，动态生成编排文件（含 agents + flow，参考插件自带
        orchestration/dark_factory_pipeline.yaml 模板），把 NLSpec 内容写入
        编排文件顶层 spec 字段（引擎据此注入各阶段 Agent 背景），落盘到
        .jarvis/.df/pipeline.yaml，用户确认编排文件无误。
      3. 调用 pipeline_runner 工具，参数：
         - orchestration_file=<动态生成的编排文件路径>
         - working_dir=<工作目录>
         - approve=false（门禁停住，等人工审批）
      4. 流水线跑完后，把审批报告路径与各阶段结果呈现给用户，交人工审批。
      5. 人工审批通过后（approve=true 重跑门禁确认）再决定是否提交/合并。
    description: 用内置编排引擎跑完整黑灯工厂流水线
  dark-factory/quick:
    append: false
    template: |
      请使用简化版黑灯工厂工作流完成以下开发（单 agent 直接干 + 知识回流，不启用多 agent 流水线编排）。
      ## 你必须遵守的规则
      - **必须**：遵守 pipeline_invariants 流程不变量规则（NLSpec 四要素先行、遵守规则集、
        在已有代码库工作、TDD 铁律、固定 spec 目录、知识回流、门禁人工审批）。
      - **必须**：开发完成后执行知识回流，保持 _reversa_sdd/ 规格文档与代码同步。
      - **禁止**：跳过测试直接交付。
      ## 你必须执行的操作
      1. 确认/补全 NLSpec：先 read_code 读取固定 NLSpec 文件
        .jarvis/.df/specs/<功能名>.md（若存在）；四要素不齐或模糊时，先向用户
        逐条提问澄清，更新后再复验。
      2. 用 TDD 铁律实现：先写测试（红）→ 写实现（绿）→ 重构，遵守 tdd_iron_rule 规则。
      3. 直接在当前代码库中修改代码，遵守 spec 的 Constraints，不越界实现 Non-goals。
      4. 跑项目既有测试 + 新增测试，确认全部通过；不通过则修复到通过。
      5. 执行知识回流：用 reversa 工具（action=sync_diff）分析基线到当前 HEAD 的
        代码变更，增量更新 _reversa_sdd/ 规格产物（新增/修改内容标 🟡INFERRED，
        确认无误升级 🟢CONFIRMED，缺口标 🔴GAP），同步完成后用 reversa 工具
        （action=sync_baseline）更新基线，再用（action=export_rules）重新导出 rule 知识库。
      6. 向用户汇报：改动清单（git diff 摘要）、测试结果、回流结果，交人工确认。
    description: 简化版黑灯工厂工作流（单 agent 直接干 + 知识回流）
  dark-factory/issue:
    append: false
    template: |
      请使用 AI 黑灯工厂工作流开发以下需求（来自 GitHub Issue）。
      ## 你必须遵守的规则
      - **必须**：遵守 pipeline_invariants 流程不变量规则（NLSpec 四要素先行、遵守规则集、
        在已有代码库工作、TDD 铁律、固定 spec 目录、知识回流、门禁人工审批、holdout 隔离纪律）。
      - **必须**：按 规划 → 生成隐藏场景 → 生成（TDD）→ 验证 → 回归 → 门禁
        六阶段推进，不跳阶段。
      - **必须**：编排文件是动态生成的「结构化 plan」，与用户讨论确认后再执行。
      - **必须**：holdout 场景只注入 validator，绝不注入 generator（隔离纪律）。
      - **必须**：门禁处输出结构化审批报告，交人工审批，不自动合并。
      - **禁止**：未经用户确认就执行编排。
      ## 你必须执行的操作
      1. 用 `gh issue view <number>` 读取目标 Issue，提取需求。
      2. 用 LLM 能力诊断 NLSpec 四要素缺口，向用户逐条提问澄清，更新后复验；
        最终 NLSpec 写入固定目录 .jarvis/.df/specs/<功能名>.md。
      3. 与用户讨论，动态生成编排文件（agents + flow，参考
        orchestration/dark_factory_pipeline.yaml 模板），先 read_code 读取
        .jarvis/.df/specs/<功能名>.md 的 NLSpec 内容，写入编排文件顶层
        spec 字段（引擎据此注入各阶段 Agent 背景），落盘
        .jarvis/.df/pipeline.yaml，用户确认无误。
      4. 调用 pipeline_runner 工具按 flow 顺序驱动六阶段流水线：
        planner 规划 → holdout 生成隐藏验收场景 → generator 写码（先写测试）
        → validator 用 holdout 评估（隔离）→ regression 跑既有测试防回归
        → orchestrator 计算门禁指标（gate 停住）。
      5. 产出审批报告后交人工确认；通过后如需提交，用 gh 提交 PR。
    description: 用黑灯工厂工作流开发 Issue 需求
  dark-factory/pr:
    append: false
    template: |
      请使用 AI 黑灯工厂工作流处理以下 GitHub Pull Request。
      ## 你必须遵守的规则
      - **必须**：遵守 pipeline_invariants 流程不变量规则（NLSpec 四要素先行、遵守规则集、
        在已有代码库工作、TDD 铁律、固定 spec 目录、知识回流、门禁人工审批、holdout 隔离纪律）。
      - **必须**：先读取 PR 的 diff 与关联 Issue，理解改动目标；改动对应的
        NLSpec 四要素不齐或模糊时，先向用户逐条提问澄清，更新后再复验。
      - **必须**：按 规划 → 生成隐藏场景 → 生成（TDD）→ 验证 → 回归 → 门禁
        六阶段推进。
      - **必须**：编排文件是动态生成的「结构化 plan」，与用户讨论确认后再执行。
      - **必须**：holdout 场景只注入 validator，绝不注入 generator（隔离纪律）。
      - **必须**：门禁处输出审批报告（各场景通过率、失败详情、
        改动 diff 摘要），交人工审批。
      - **禁止**：未经人工审批自动合并 PR；未经用户确认就执行编排。
      ## 你必须执行的操作
      1. 用 `gh pr view <number>` 读取 PR 详情，用 `gh pr diff <number>` 查看改动。
      2. 用 LLM 能力诊断改动对应的 NLSpec 四要素缺口，向用户逐条提问澄清，更新后复验；
        最终 NLSpec 写入固定目录 .jarvis/.df/specs/<功能名>.md。
      3. 与用户讨论，动态生成编排文件（agents + flow，参考
        orchestration/dark_factory_pipeline.yaml 模板），先 read_code 读取
        .jarvis/.df/specs/<功能名>.md 的 NLSpec 内容，写入编排文件顶层
        spec 字段（引擎据此注入各阶段 Agent 背景），落盘
        .jarvis/.df/pipeline.yaml，用户确认无误。
      4. 调用 pipeline_runner 工具按 flow 顺序驱动六阶段流水线：
        规划 → 生成隐藏场景 → 生成（补齐缺失实现/测试）→ 验证 → 回归 → 门禁（gate 停住）。
      5. 产出审批报告交人工确认；通过后如需合并，用 `gh pr merge <number>`（先与用户确认）。
    description: 用黑灯工厂工作流处理 PR
